<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四川人的家门｜剑门行前书</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body class="book-site"><header class="book-nav"><a class="book-mark" href="index.html"><span>剑门</span>行前书</a><button class="nav-menu" type="button" aria-expanded="false" aria-controls="chapter-nav">章节</button><nav id="chapter-nav"><a href="index.html">目录</a><a href="map.html">地图册</a><a href="quotes.html">剑门佳句</a><a href="shudaonan.html">蜀道难</a><a href="stories.html">故事阁</a><a href="quest.html">去现场</a></nav></header><main><section class="chapter home" style="min-height:calc(100vh - 68px)"><div class="home-copy"><div class="chapter-number light">第六章</div><p class="kicker light">山门的后面，并不只是地图上的四川</p><h2>它守着炊烟、田地、街巷，<br>也守着人们回家的方向。</h2><p>对于从北方长途跋涉而来的人，穿过剑门，是进入蜀地；对于生活在四川的人，这道关也像家门——门外是漫长险路，门内是熟悉的生活。</p><p>剑门关的特殊，不只因为它难走、难攻。更因为千百年来，人们总会想到：这道门的身后，有什么值得守护？</p><a class="read-next" href="quest.html">带上现场任务出发 <span>→</span></a></div><div class="home-light" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></section></main><footer class="chapter-footer"><a href="stories.html">← 上一章：故事阁</a><span>第六章 / 共六章</span><a href="quest.html">去现场 →</a></footer><script src="book.js"></script></body></html>
